# Editor for nahawandi.com — open https://nahawandi.com/admin/
# Every "Save" commits to GitHub (main); the site rebuilds itself in ~1 minute.
backend:
  name: github
  repo: qbawwab/nahawandi-site
  branch: main
  commit_messages:
    update: "Edit {{collection}} “{{slug}}”"

site_url: https://nahawandi.com
display_url: https://nahawandi.com
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: content
    label: Website
    files:
      # ───────── Homepage texts & photos ─────────
      - name: homepage
        label: Homepage — texts & photos
        file: src/data/site.json
        fields:
          - { name: seoTitle, label: "Browser tab / Google title", widget: string }
          - { name: seoDescription, label: "Google description", widget: text }
          - name: hero
            label: Hero (top of page)
            widget: object
            collapsed: false
            fields:
              - { name: tagLeft, label: "Small tag, left", widget: string }
              - { name: tagRight, label: "Small tag, right", widget: string }
              - { name: image, label: "Hero photo (arch)", widget: image }
              - { name: copy, label: "Intro text", widget: text }
              - { name: cta, label: "Button text", widget: string }
          - name: sound
            label: Sound Archive
            widget: object
            fields:
              - { name: arabic, label: "Arabic heading", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: intro, label: "Intro line", widget: text }
              - name: mix
                label: Live set
                widget: object
                fields:
                  - { name: eyebrow, label: "Small label (next to the pulsing dot)", widget: string }
                  - { name: title, label: "Title", widget: string }
                  - { name: meta, label: "Details line", widget: string }
                  - { name: soundcloud, label: "SoundCloud link", widget: string }
          - name: about
            label: About
            widget: object
            fields:
              - { name: image, label: "Photo (arch)", widget: image }
              - { name: captionLeft, label: "Caption, left", widget: string }
              - { name: captionRight, label: "Caption, right", widget: string }
              - { name: heading, label: "Heading", widget: string }
              - { name: story, label: "Main text", widget: text }
              - { name: maqam, label: "Second text (grey)", widget: text }
              - { name: linkLabel, label: "Biography link text", widget: string }
          - name: live
            label: Live section
            widget: object
            fields:
              - { name: heading, label: "Heading", widget: string }
              - { name: arabic, label: "Arabic word", widget: string }
              - { name: label, label: "Small label", widget: string }
              - { name: ctaText, label: "Booking line", widget: string }
              - { name: ctaLabel, label: "Booking link text", widget: string }
          - name: contact
            label: Contact & footer
            widget: object
            fields:
              - { name: emails, label: "Email addresses", widget: list, field: { name: email, label: Email, widget: string } }
              - name: links
                label: "Elsewhere links"
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { name: name, label: "Name", widget: string }
                  - { name: url, label: "Link (use # for none yet)", widget: string }
              - { name: copyright, label: "Footer line", widget: string }

      # ───────── Tracks ─────────
      - name: tracks
        label: Tracks
        file: src/data/tracks.json
        fields:
          - name: tracks
            label: Tracks (drag to reorder)
            widget: list
            summary: "{{fields.title}} — {{fields.source}}"
            fields:
              - { name: title, label: "Title", widget: string }
              - { name: source, label: "Label 1 (e.g. RELEASE)", widget: string }
              - { name: chapter, label: "Label 2 (leave empty to show the chapters)", widget: string, required: false }
              - { name: duration, label: "Label 3 (e.g. SINGLE or a time)", widget: string }
              - name: categories
                label: "Chapters (tabs it shows under)"
                widget: select
                multiple: true
                required: false
                options:
                  - { label: Groove, value: groove }
                  - { label: Hypnotic, value: hypnotic }
                  - { label: Reimagined, value: reimagined }
              - { name: description, label: "Short text about the track (optional)", widget: text, required: false }
              - { name: artwork, label: "Artwork", widget: image, required: false }
              - { name: soundcloud, label: "SoundCloud link", widget: string }
              - { name: start, label: "Player start time (m:ss, optional)", widget: string, required: false }
              - { name: spotify, label: "Spotify link (optional)", widget: string, required: false }
              - { name: note, label: "Small note next to buttons", widget: string, required: false }
              - { name: credit, label: "Original artist (not shown)", widget: string, required: false }
              - { name: hidden, label: "Hide this track", widget: boolean, required: false, default: false }

      # ───────── Live dates ─────────
      - name: gigs
        label: Live dates
        file: src/data/gigs.json
        fields:
          - name: gigs
            label: Dates (top = first)
            widget: list
            summary: "{{fields.date}} — {{fields.name}}"
            fields:
              - { name: date, label: "Date (e.g. SEPTEMBER 2026)", widget: string }
              - { name: name, label: "Venue / event", widget: string }
              - { name: place, label: "City", widget: string }

      # ───────── Biography ─────────
      - name: biography
        label: Biography page
        file: src/data/bio.json
        fields:
          - { name: lead, label: "Intro (large italic)", widget: text }
          - { name: paragraphs, label: "Paragraphs", widget: list, field: { name: paragraph, label: Paragraph, widget: text } }
